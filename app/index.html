<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Neon Tide | Cover Studio</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./src/studio.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Neon Tide home">
      <span class="brand-mark" aria-hidden="true">N</span>
      <span><strong>NEON TIDE</strong><small>Cover Studio</small></span>
    </a>
    <div class="history" aria-label="Edit history">
      <button id="undo" type="button" aria-label="Undo"><span aria-hidden="true">↶</span> Undo</button>
      <button id="redo" type="button" aria-label="Redo"><span aria-hidden="true">↷</span> Redo</button>
    </div>
    <span class="private"><i></i> Photos stay on this device</span>
  </header>

  <main class="workbench" id="workbench">
    <aside class="deck content" aria-label="Poster content">
      <section class="group">
        <div class="group-heading"><h2>Photo library</h2><span id="photo-count"></span></div>
        <label class="import" for="photo-input" id="drop-zone">
          <span aria-hidden="true">＋</span> Add photos
          <input id="photo-input" type="file" accept="image/*" multiple>
        </label>
        <div id="library" class="library" aria-label="Available photos"></div>
        <button id="auto-fill" class="quiet full" type="button">Fill panels from library <span aria-hidden="true">↗</span></button>
      </section>
      <section class="group text-controls">
        <div class="group-heading"><h2>Caption</h2></div>
        <label>Title<input id="title" type="text" maxlength="36" autocomplete="off" spellcheck="false"></label>
        <label>Subtitle<input id="subtitle" type="text" maxlength="54" autocomplete="off"></label>
        <label>Tagline<input id="tagline" type="text" maxlength="60" autocomplete="off"></label>
        <label>Edition<input id="edition" type="text" maxlength="18" autocomplete="off"></label>
      </section>
    </aside>

    <section class="stage" id="stage" aria-label="Live poster preview">
      <div class="stage-header">
        <h1>Live cover</h1>
        <div id="format-picker" class="segments" aria-label="Preview size"></div>
      </div>
      <div id="preview-area" class="preview-area">
        <div class="preview-frame" id="preview-frame">
          <canvas id="poster" aria-label="Your poster preview"></canvas>
          <svg id="selection" class="selection" aria-hidden="true"><polygon id="selection-border"></polygon></svg>
        </div>
      </div>
      <div class="stage-help"><span>Drag a panel to move its photo · Scroll to zoom</span><span id="preview-dimensions"></span></div>
      <nav id="panel-picker" class="panel-picker" aria-label="Select a photo panel"></nav>
    </section>

    <aside class="deck inspector" aria-label="Poster settings">
      <section class="group">
        <div class="group-heading"><h2>Selected panel</h2><span id="panel-number"></span></div>
        <div class="panel-source">
          <canvas id="panel-tile" width="112" height="80" aria-hidden="true"></canvas>
          <label>Assigned photo<select id="assigned-photo"></select></label>
        </div>
        <label>Role label<input id="role" type="text" maxlength="20" autocomplete="off"></label>
        <div class="sliders">
          <label for="zoom"><span>Zoom <output id="zoom-value"></output></span><input type="range" id="zoom" min="1" max="3" step=".01"></label>
          <label for="pan-x"><span>Horizontal <output id="x-value"></output></span><input type="range" id="pan-x" min="-1" max="1" step=".01"></label>
          <label for="pan-y"><span>Vertical <output id="y-value"></output></span><input type="range" id="pan-y" min="-1" max="1" step=".01"></label>
        </div>
        <div class="button-row">
          <button id="flip" type="button">Flip</button>
          <button id="center" type="button">Center</button>
          <button id="reset-crop" type="button">Reset</button>
        </div>
      </section>
      <section class="group look">
        <div class="group-heading"><h2>Poster look</h2></div>
        <div class="look-grid">
          <label>Layout<select id="layout"></select></label>
          <label>Title finish<select id="finish"><option value="chrome">Chrome</option><option value="neon">Neon</option><option value="paper">Paper</option></select></label>
        </div>
        <div class="grade-label"><span>Color grade</span><output id="grade-label"></output></div>
        <div class="grades" id="grades" aria-label="Color grade presets"></div>
        <label class="grade-amount" for="strength"><span>Intensity <output id="strength-value"></output></span><input type="range" id="strength" min="0" max="1" step=".01"></label>
        <label class="check"><input id="ink" type="checkbox"> Extra contrast</label>
      </section>
      <section class="group exports">
        <div class="group-heading"><h2>Export PNG</h2></div>
        <div id="export-sizes" class="export-sizes"></div>
      </section>
    </aside>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
